<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 280"
     width="1000"
     height="280"
     role="img"
     aria-label="Suhas M Alur - Frontend Developer">

  <defs>

    <!-- NAME GRADIENT -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color"
          values="#58A6FF;#A855F7;#22D3EE;#58A6FF"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color"
          values="#A855F7;#22D3EE;#58A6FF;#A855F7"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color"
          values="#22D3EE;#58A6FF;#A855F7;#22D3EE"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- LINE -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58A6FF"/>
      <stop offset="65%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- BACKGROUND GLOWS -->
    <radialGradient id="blobA">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobC">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0 L0 0 0 40"
            fill="none"
            stroke="#8B949E"
            stroke-width="0.5"
            opacity="0.10"/>
    </pattern>

    <!-- FRAME -->
    <clipPath id="frame">
      <rect x="0"
            y="0"
            width="1000"
            height="280"
            rx="18"/>
    </clipPath>

  </defs>


  <!-- FRAME -->
  <g clip-path="url(#frame)">

    <!-- BACKGROUND -->
    <rect width="1000"
          height="280"
          fill="#0B0F17"/>


    <!-- GLOWING BLOBS -->

    <circle cx="170"
            cy="80"
            r="230"
            fill="url(#blobA)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;90,40;-40,60;0,0"
        dur="14s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="620"
            cy="220"
            r="260"
            fill="url(#blobB)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;-80,-50;60,-20;0,0"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="880"
            cy="70"
            r="200"
            fill="url(#blobC)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;-50,70;30,-40;0,0"
        dur="16s"
        repeatCount="indefinite"/>

    </circle>


    <!-- MOVING GRID -->

    <g>

      <rect x="-40"
            y="-40"
            width="1080"
            height="360"
            fill="url(#grid)"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;40,40;0,0"
        dur="12s"
        repeatCount="indefinite"/>

    </g>


    <!-- TERMINAL DOTS -->

    <g opacity="0.9">

      <circle cx="40"
              cy="34"
              r="6"
              fill="#FF5F56">

        <animate
          attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="62"
              cy="34"
              r="6"
              fill="#FFBD2E">

        <animate
          attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          begin="0.4s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="84"
              cy="34"
              r="6"
              fill="#27C93F">

        <animate
          attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          begin="0.8s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- RIGHT SIDE ORBIT -->

    <g transform="translate(855,140)">

      <circle r="72"
              fill="none"
              stroke="#A855F7"
              stroke-width="1"
              opacity="0.35"/>

      <circle r="48"
              fill="none"
              stroke="#22D3EE"
              stroke-width="1"
              opacity="0.30"/>


      <g>

        <circle cx="72"
                cy="0"
                r="4.5"
                fill="#58A6FF"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="9s"
          repeatCount="indefinite"/>

      </g>


      <g>

        <circle cx="48"
                cy="0"
                r="3.5"
                fill="#22D3EE"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360"
          to="0"
          dur="6s"
          repeatCount="indefinite"/>

      </g>


      <g>

        <circle cx="0"
                cy="72"
                r="3"
                fill="#A855F7"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="120"
          to="480"
          dur="13s"
          repeatCount="indefinite"/>

      </g>

    </g>


    <!-- TEXT -->

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">


      <!-- WHOAMI -->

      <text x="60"
            y="98"
            font-size="15"
            fill="#8B949E"
            letter-spacing="3">

        <tspan fill="#58A6FF">~/</tspan>whoami

      </text>


      <!-- YOUR NAME -->

      <text x="58"
            y="146"
            font-size="52"
            font-weight="700"
            letter-spacing="1.5"
            fill="url(#nameGrad)">

        SUHAS M ALUR

      </text>


      <!-- TAGLINE 1 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9">

        Frontend Developer

        <animate
          attributeName="opacity"
          values="1;1;0;0;0;0"
          keyTimes="0;0.18;0.23;0.33;0.85;1"
          dur="12s"
          repeatCount="indefinite"/>

      </text>


      <!-- TAGLINE 2 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9"
            opacity="0">

        Design + Code + AI

        <animate
          attributeName="opacity"
          values="0;0;1;1;0;0"
          keyTimes="0;0.18;0.23;0.45;0.50;1"
          dur="12s"
          repeatCount="indefinite"/>

      </text>


      <!-- TAGLINE 3 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9"
            opacity="0">

        Building Interactive Web Experiences

        <animate
          attributeName="opacity"
          values="0;0;0;0;1;1;0"
          keyTimes="0;0.45;0.50;0.55;0.60;0.85;1"
          dur="12s"
          repeatCount="indefinite"/>

      </text>


      <!-- CURSOR -->

      <rect x="62"
            y="166"
            width="10"
            height="20"
            fill="#58A6FF">

        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="1s"
          repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- SEPARATOR -->

    <path d="M60 214 L940 214"
          stroke="url(#lineGrad)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-dasharray="880"
          stroke-dashoffset="880">

      <animate
        attributeName="stroke-dashoffset"
        values="880;0;0;880"
        keyTimes="0;0.35;0.85;1"
        dur="10s"
        repeatCount="indefinite"/>

    </path>


    <!-- TECH STACK -->

    <text x="60"
          y="244"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13"
          fill="#6E7681"
          letter-spacing="2">

      HTML · CSS · JAVASCRIPT · PYTHON · MYSQL · GIT

    </text>


    <!-- FLOATING PARTICLES -->

    <g>

      <circle cx="150"
              cy="250"
              r="2"
              fill="#A855F7">

        <animate
          attributeName="cy"
          values="270;20"
          dur="9s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0;0.8;0"
          dur="9s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="430"
              cy="250"
              r="1.6"
              fill="#22D3EE">

        <animate
          attributeName="cy"
          values="290;10"
          dur="12s"
          begin="1.5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0;0.7;0"
          dur="12s"
          begin="1.5s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="700"
              cy="250"
              r="2.2"
              fill="#58A6FF">

        <animate
          attributeName="cy"
          values="280;15"
          dur="11s"
          begin="3s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0;0.75;0"
          dur="11s"
          begin="3s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="930"
              cy="250"
              r="1.8"
              fill="#A855F7">

        <animate
          attributeName="cy"
          values="275;25"
          dur="10s"
          begin="4.5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0;0.7;0"
          dur="10s"
          begin="4.5s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- BORDER -->

    <rect x="0.5"
          y="0.5"
          width="999"
          height="279"
          rx="18"
          fill="none"
          stroke="#30363D"
          stroke-width="1"/>

  </g>

</svg>
