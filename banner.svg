<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 280"
     width="1000"
     height="280"
     role="img"
     aria-label="Suhas Alur - Frontend Developer">

  <defs>

    <!-- NAME GRADIENT -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4D6D">
        <animate attributeName="stop-color"
          values="#FF4D6D;#C77DFF;#4CC9F0;#FF4D6D"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#C77DFF">
        <animate attributeName="stop-color"
          values="#C77DFF;#4CC9F0;#FF4D6D;#C77DFF"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#4CC9F0">
        <animate attributeName="stop-color"
          values="#4CC9F0;#FF4D6D;#C77DFF;#4CC9F0"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>


    <!-- LINE GRADIENT -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF4D6D"/>
      <stop offset="65%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>


    <!-- BACKGROUND GLOWS -->

    <radialGradient id="blobA">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobC">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>


    <!-- GRID -->

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0 L0 0 0 40"
            fill="none"
            stroke="#8B949E"
            stroke-width="0.5"
            opacity="0.10"/>

    </pattern>


    <!-- FRAME -->

    <clipPath id="frame">
      <rect width="1000"
            height="280"
            rx="18"/>
    </clipPath>

  </defs>


  <!-- FRAME -->

  <g clip-path="url(#frame)">


    <!-- BACKGROUND -->

    <rect width="1000"
          height="280"
          fill="#0B0F17"/>


    <!-- GLOW 1 -->

    <circle cx="180"
            cy="90"
            r="230"
            fill="url(#blobA)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;90,40;-40,60;0,0"
        dur="14s"
        repeatCount="indefinite"/>

    </circle>


    <!-- GLOW 2 -->

    <circle cx="620"
            cy="220"
            r="260"
            fill="url(#blobB)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;-80,-50;60,-20;0,0"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>


    <!-- GLOW 3 -->

    <circle cx="880"
            cy="70"
            r="200"
            fill="url(#blobC)">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0;-50,70;30,-40;0,0"
        dur="16s"
        repeatCount="indefinite"/>

    </circle>


    <!-- GRID -->

    <rect x="-40"
          y="-40"
          width="1080"
          height="360"
          fill="url(#grid)"/>


    <!-- MAC WINDOW DOTS -->

    <g opacity="0.9">

      <circle cx="40"
              cy="34"
              r="6"
              fill="#FF5F56">
        <animate attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          repeatCount="indefinite"/>
      </circle>


      <circle cx="62"
              cy="34"
              r="6"
              fill="#FFBD2E">
        <animate attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          begin="0.4s"
          repeatCount="indefinite"/>
      </circle>


      <circle cx="84"
              cy="34"
              r="6"
              fill="#27C93F">
        <animate attributeName="opacity"
          values="1;0.35;1"
          dur="3s"
          begin="0.8s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ORBIT -->

    <g transform="translate(855,140)">

      <circle r="72"
              fill="none"
              stroke="#C77DFF"
              stroke-width="1"
              opacity="0.35"/>

      <circle r="48"
              fill="none"
              stroke="#4CC9F0"
              stroke-width="1"
              opacity="0.3"/>


      <g>

        <circle cx="72"
                cy="0"
                r="4.5"
                fill="#FF4D6D"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="9s"
          repeatCount="indefinite"/>

      </g>


      <g>

        <circle cx="48"
                cy="0"
                r="3.5"
                fill="#4CC9F0"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360"
          to="0"
          dur="6s"
          repeatCount="indefinite"/>

      </g>


      <g>

        <circle cx="0"
                cy="72"
                r="3"
                fill="#C77DFF"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="120"
          to="480"
          dur="13s"
          repeatCount="indefinite"/>

      </g>

    </g>


    <!-- TEXT -->

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">


      <!-- WHOAMI -->

      <text x="60"
            y="98"
            font-size="15"
            fill="#8B949E"
            letter-spacing="3">

        <tspan fill="#4CC9F0">~/</tspan>whoami

      </text>


      <!-- NAME -->

      <text x="58"
            y="146"
            font-size="52"
            font-weight="700"
            letter-spacing="1.5"
            fill="url(#nameGrad)">

        SUHAS ALUR

      </text>


      <!-- NAME SHINE -->

      <text x="58"
            y="146"
            font-size="52"
            font-weight="700"
            letter-spacing="1.5"
            fill="white"
            opacity="0">

        SUHAS ALUR

        <animate attributeName="opacity"
          values="0;0;0.7;0;0"
          keyTimes="0;0.42;0.50;0.58;1"
          dur="7s"
          repeatCount="indefinite"/>

      </text>


      <!-- SUBTITLE 1 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9"
            opacity="1">

        Frontend Developer

        <animate attributeName="opacity"
          values="1;1;0;0"
          keyTimes="0;0.22;0.28;0.33"
          dur="9s"
          repeatCount="indefinite"/>

      </text>


      <!-- SUBTITLE 2 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9"
            opacity="0">

        Building Web Projects

        <animate attributeName="opacity"
          values="0;0;1;1;0"
          keyTimes="0;0.28;0.34;0.55;0.61"
          dur="9s"
          repeatCount="indefinite"/>

      </text>


      <!-- SUBTITLE 3 -->

      <text x="62"
            y="182"
            font-size="20"
            fill="#C9D1D9"
            opacity="0">

        Learning Python + DSA

        <animate attributeName="opacity"
          values="0;0;1;1;0"
          keyTimes="0;0.58;0.64;0.85;0.91"
          dur="9s"
          repeatCount="indefinite"/>

      </text>


      <!-- CURSOR -->

      <rect x="62"
            y="166"
            width="10"
            height="20"
            fill="#FF4D6D">

        <animate attributeName="opacity"
          values="1;0;1"
          dur="1s"
          repeatCount="indefinite"/>

        <animate attributeName="x"
          values="62;250;62"
          dur="9s"
          repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- DIVIDER -->

    <path d="M60 214 L940 214"
          stroke="url(#lineGrad)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-dasharray="880"
          stroke-dashoffset="880">

      <animate attributeName="stroke-dashoffset"
        values="880;0;0;880"
        keyTimes="0;0.35;0.85;1"
        dur="10s"
        repeatCount="indefinite"/>

    </path>


    <!-- TECH STACK -->

    <text x="60"
          y="244"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13"
          fill="#6E7681"
          letter-spacing="2">

      HTML · CSS · JAVASCRIPT · PYTHON · JAVA · MYSQL

    </text>


    <!-- FLOATING PARTICLES -->

    <circle cx="150"
            cy="250"
            r="2"
            fill="#C77DFF">

      <animate attributeName="cy"
        values="270;20"
        dur="9s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
        values="0;0.8;0"
        dur="9s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="430"
            cy="250"
            r="1.6"
            fill="#4CC9F0">

      <animate attributeName="cy"
        values="290;10"
        dur="12s"
        begin="1.5s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
        values="0;0.7;0"
        dur="12s"
        begin="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="700"
            cy="250"
            r="2.2"
            fill="#FF4D6D">

      <animate attributeName="cy"
        values="280;15"
        dur="11s"
        begin="3s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
        values="0;0.75;0"
        dur="11s"
        begin="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="930"
            cy="250"
            r="1.8"
            fill="#C77DFF">

      <animate attributeName="cy"
        values="275;25"
        dur="10s"
        begin="4.5s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
        values="0;0.7;0"
        dur="10s"
        begin="4.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- BORDER -->

    <rect x="0.5"
          y="0.5"
          width="999"
          height="279"
          rx="18"
          fill="none"
          stroke="#30363D"
          stroke-width="1"/>

  </g>

</svg>
